name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Static analysis
        run: ./gradlew detekt

      - name: Input pipeline tests (pure JVM)
        run: ./gradlew :input-core:test

      - name: Focus navigation and sample tests (Compose on Robolectric)
        run: ./gradlew testDebugUnitTest

      - name: Assemble the sample app
        run: ./gradlew :sample:assembleDebug

      - name: Check the libraries publish (what JitPack runs)
        run: ./gradlew :input-core:publishToMavenLocal :rotary-compose:publishToMavenLocal

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      - uses: actions/upload-artifact@v4
        with:
          name: sample-debug
          path: sample/build/outputs/apk/debug/*.apk
